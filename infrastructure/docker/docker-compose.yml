services:
  postgres:
    image: postgres:16-alpine
    container_name: aeropex-postgres
    environment:
      POSTGRES_DB: aeropex
      POSTGRES_USER: aeropex
      POSTGRES_PASSWORD: aeropex_local_password
    ports:
      - "15432:5432"
    volumes:
      - aeropex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U aeropex -d aeropex" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aeropex-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aeropex_postgres_data:
