[project]
name = "aeropex-buyer-intelligence"
version = "0.1.0"
description = "Aeropex Buyer Intelligence Data Platform foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "celery>=5.4.0",
    "fastapi>=0.141.1,<0.142.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.8.2",
    "pydantic-settings>=2.4.0",
    "pytest>=8.3.2",
    "redis>=5.0.8",
    "ruff>=0.8.0",
    "sqlalchemy>=2.0.32",
    "starlette>=1.6.0,<1.7.0",
    "uvicorn[standard]>=0.30.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "apps/api/src",
    "packages/contracts/src",
    "services/workers/src",
]
markers = [
    "integration: tests requiring local infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "apps/api/src",
    "packages/contracts/src",
    "services/workers/src",
]
